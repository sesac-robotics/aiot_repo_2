name: Qt evaluation GUI
on:
  pull_request:
  push:
    branches: [feature/exercise-posture-scoring, feature/team-integration-standards]
jobs:
  qt-without-camera:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0
      - run: python -m pip install pytest==9.1.1 -r GUI/FitHelper/requirements-desktop.txt
      - run: >-
          python -m pytest -q tests/integration/test_gui.py
          tests/integration/test_evaluation_gui.py
          tests/integration/test_integrated_session.py
          tests/integration/test_correction_recording.py
          tests/integration/test_score_observation.py
          tests/integration/test_score_preview_privacy.py
          tests/integration/test_evaluation_portability.py
          tests/integration/test_evaluation_architecture.py
