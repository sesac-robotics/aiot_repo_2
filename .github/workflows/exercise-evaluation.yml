name: Exercise evaluation boundaries
on:
  pull_request:
  push:
    branches: [feature/exercise-posture-scoring]
jobs:
  control-without-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4 opencv-python-headless==4.11.0.86
      - run: python -m unittest discover -s Server/ExerciseEvaluation/tests -v
