[tool.black]
line-length = 80
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 80
known_first_party = ["app", "GUI", "Server"]

[tool.pytest.ini_options]
testpaths = ["tests/integration", "Server/AIService/tests/scoring"]
pythonpath = [".", "Server/AIService"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
files = ["Server/AIFitService/domain", "GUI/FitHelper/domain"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
