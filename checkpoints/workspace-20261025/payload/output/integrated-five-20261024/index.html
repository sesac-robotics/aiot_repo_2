<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5종 운동 · 기존 자료 통합 학습 결과</title><style>body{font:16px/1.7 system-ui;color:#192d44;background:#f2f5f8;margin:0}main{max-width:1200px;margin:auto;padding:32px}h1{font-size:30px}h2{font-size:21px}section{padding:24px;background:white;border:1px solid #d6e0e9;border-radius:12px;margin:20px 0}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8ef;text-align:left}th{background:#eef3f9}a{color:#155e9a}small{color:#53657a}details{margin:12px 0}strong{color:#193e68}.stats{display:flex;gap:16px;flex-wrap:wrap}.stats div{flex:1;background:#e9f0f8;border-radius:8px;padding:15px}.stats b{display:block;font-size:26px}.scroll{overflow:auto}.notice{background:#fff7e6;padding:16px;border-radius:9px}select{font:inherit;padding:7px}button{font:inherit;padding:8px}pre{white-space:pre-wrap}footer{font-size:14px;color:#52647b}</style><main><h1>5종 운동 · 기존 자료 통합 학습 결과</h1><p>2026.10.24 · QEVD · REHAB24/26 · 미국 해군 · AI-Hub · 다중 시점 · R2D2</p><div id="content">결과 파일을 읽고 있습니다.</div><footer>비전문가 시각 라벨을 포함한 실험 결과입니다. 관찰 가능한 항목의 예측이며 의료·안전 판정이 아닙니다. 같은 사람과 원본의 파생 구간은 독립 표본으로 세지 않습니다.</footer></main><script>
const names={squats:'스쿼트',pushups:'푸시업',shoulder:'숄더 프레스',plank:'플랭크',ytw:'Y–T–W',Y_only:'Y 형태'},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>v==null?'—':v.toFixed(3),pct=v=>v==null?'—':(v*100).toFixed(1)+'%';const itemNames={trunk_line:'몸통 정렬',descent_range:'하강 범위',return_extension:'팔·다리 펴기 복귀',standing_height_return:'서기 높이 복귀',knee_gap:'무릎 간격',knee_foot:'무릎·발 복합 기준',trunk_balance:'좌우 몸통 안정',overhead_reach:'머리 위 도달',lower_return:'하단 복귀',bilateral_timing:'양팔 동시성',frontal_trunk_hold:'정면 몸통 안정',elbow_sagittal_position:'팔꿈치 위치',leg_and_body_support:'다리·몸통 추가 지지',support_continuity:'지지 지속',support:'손·발 지지',y_reach:'Y 형태',t_reach:'T 형태',w_shape:'W 형태',upright_trunk_hold:'서 있는 몸통 안정',hinge_and_trunk_hold:'숙인 몸통 유지'},bankNames={front:'정면',side:'측면',front_oblique:'사선',side_video:'측면 영상',front_projected:'정면 투영',front_visible_interruption:'상체 지지 변화',height_v4:'기립 기준 높이',upright_temporal_v1:'서서 하는 단계 흐름',front_gap_v1:'정면 무릎 간격',front_seated:'앉은 정면',side_support_clearance_v1:'측면 추가 지지',side_foot_partial_top_v2:'측면 발 지지'};let data;
fetch('report-data.json').then(r=>r.json()).then(d=>{data=d;let s=d.summary;document.querySelector('#content').innerHTML=`<section><h2>실제 수행한 학습</h2><div class="stats"><div><b>${s.actual_score_training_segments}개</b>실제 점수 학습 구간</div><div><b>${d.score.trained_heads}개</b>학습한 점수 항목 모델</div><div><b>${Object.values(s.native_tasks).reduce((a,b)=>a+b,0)}개</b>제공자 라벨 분류 과제</div><div><b>${s.neural_epochs}회</b>복귀 신경망 최종 학습 에포크</div></div><p>총 ${s.score_input_count}개 후보 입력을 정리했고, 기존 자료와 팀 영상 중 실제 조건을 충족하는 구간을 함께 학습했습니다. 제공자가 붙인 오류·자세 조건은 원래 의미대로 별도 분류 모델에 학습했고, 우리 항목 점수는 직접 검토한 라벨로 학습했습니다.</p><p class="notice"><strong>기존 서비스 모델은 교체하지 않았습니다.</strong> 아래 비교는 개발 검증 결과이며 새 사람에 대한 최종 성능 인증이 아닙니다. 정상·오류 자료가 부족한 항목은 정상 점수를 상수로 채우지 않습니다.</p><p><a href="summary.json">전체 결과·모델 파일 목록</a> · <a href="RESULTS.txt">다음 작업용 결과 기록</a> · <a href="verification.json">검증 결과</a> · <a href="score-intake-audit.json">자료 통합 감사</a> · <a href="/output/r2d2-review-20261024/index.html">팀 영상 라벨 검토</a></p></section>
<section><h2>5종 운동별 현황</h2><div class="scroll"><table><tr><th>운동</th><th>학습 구간</th><th>개발 검증 구간</th><th>학습한 항목·구도 모델</th><th>추가 검증 후보</th></tr>${s.exercises.map(e=>`<tr><td>${names[e.exercise]}</td><td>${e.training_segments}</td><td>${e.validation_segments}</td><td>${e.trained_heads}</td><td>${e.gate_passed}</td></tr>`).join('')}</table></div><p>같은 운동에도 항목·구도·변형별 모델이 여러 개 있습니다. 학습·검증 구간은 실제 모델 입력에 사용된 구간만 셌습니다. 위의 구간 수는 독립 참가자 수가 아닙니다. 추가 검증 후보는 일부 내부 조건을 통과한 수이며 서비스 적용 수가 아닙니다.</p><details><summary>출처별 점수 입력 수</summary><pre>${esc(JSON.stringify({전체입력:s.source_families,실제점수학습:s.source_families_actually_fit},null,2))}</pre></details></section>
<section><h2>서기 높이 복귀</h2><p>기존 부분 복귀 라벨과 팀 촬영의 복귀 장면을 함께 사용했습니다. 하강 전 서 있는 기준과 하강 이후 복귀 높이를 연결하며, 시간 순서를 담은 특징을 사용했습니다. 심한 미복귀인 0등급 사례는 부족합니다.</p><p>트리·부스팅 후보와 신경망을 비교했습니다. 신경망은 폴드마다 학습 사람 중 별도 사람을 조기 종료 검증에 사용했습니다. 최대 80에포크, 최종 재학습 ${d.neural.full_training_epochs}에포크입니다.</p><table><tr><th>복귀 신경망</th><th>등급 평균 오차(0~2)</th><th>부분 복귀 검출률</th><th>정상 오탐률</th></tr><tr><td>사람 분리 교차검증</td><td>${num(d.neural.group_cv.MAE)}</td><td>${pct(d.neural.group_cv.error_recall)}</td><td>${pct(d.neural.group_cv.normal_false_alarm)}</td></tr><tr><td>고정 개발 검증</td><td>${num(d.neural.fixed_development_validation?.MAE)}</td><td>${pct(d.neural.fixed_development_validation?.error_recall)}</td><td>${pct(d.neural.fixed_development_validation?.normal_false_alarm)}</td></tr></table></section>
<section><h2>점수 항목별 비교</h2><label>운동 <select id="exercise"><option value="">전체</option>${Object.entries(names).filter(([k])=>k!='Y_only').map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label><div class="scroll" id="heads"></div><p>오차는 0~2 등급 단위입니다. 오류 검출은 예측 등급 1.5 미만을 기준으로 집계했습니다. 교차검증과 고정 개발 검증을 구분하며, 자료가 부족하면 수치를 만들지 않습니다.</p><a href="score-training.json">모든 항목·폴드·예측 결과</a></section>
<section><h2>기존 제공자 라벨 학습</h2>${Object.entries(d.native).map(([source,r])=>`<details><summary>${source.toUpperCase()} · ${r.tasks.length}개 과제</summary><div class="scroll"><table><tr><th>운동·과제</th><th>학습 수</th><th>사람·그룹 수</th><th>교차검증 macro-F1</th><th>제공자 Validation macro-F1</th></tr>${r.tasks.map(t=>`<tr><td>${esc(names[t.exercise]||t.task||'스쿼트')} · ${esc(t.error||t.condition||t.task)}</td><td>${t.train_n}</td><td>${t.train_groups}</td><td>${num(t.cross_validation?.macro_f1)}</td><td>${num(t.provider_validation?.macro_f1)}</td></tr>`).join('')}</table></div><a href="${source}-native-training.json">과제별 상세 결과</a></details>`).join('')}<p>AI-Hub는 제공된 2D 관절 좌표·조건을 학습했습니다. 원시 이미지 전체로 새 영상 모델을 학습한 결과는 아닙니다. Y 자료는 T·W 단계의 정답으로 사용하지 않았습니다. 제공 조건의 true/false를 일괄적으로 정상/오류 점수로 변환하지 않았습니다. 엄지 방향은 제공 관절로 확인할 수 없어 제외했고, 고개·목 과제에는 해당 부위의 좌표를 포함했습니다.</p></section>
<section><h2>구분해서 해석할 내용</h2><p>서서 하는 Y–T–W와 숙여서 하는 변형, 프레스의 앉기·서기, 플랭크의 손·무릎 지지 변형을 보존했습니다. 스쿼트 정면 무릎 간격과 기존 무릎·발 복합 항목도 구분했습니다. 가려진 관절이나 접촉을 임의로 정상 처리하지 않았습니다.</p><p>다음 개선은 부족한 오류 유형의 실제 예시 보강, 독립 검토, 새 사람·새 촬영에서의 최종 평가입니다. 모델 파일과 입력·설정·진행 기록은 이 폴더에 저장했습니다.</p><details><summary>관절 추적 검토 화면</summary>${Array.from({length:10},(_,i)=>`<a href="tracking-review-${String(i+1).padStart(2,'0')}.jpg">검토 ${i+1}</a>`).join(' · ')}</details></section>`;document.querySelector('#exercise').onchange=heads;heads();}).catch(e=>{document.querySelector('#content').textContent='결과 파일 생성 중입니다. 학습이 끝난 후 새로 고침하면 결과가 표시됩니다.'});
function heads(){let rs=data.score.heads.filter(r=>!document.querySelector('#exercise').value||r.key[0]==document.querySelector('#exercise').value);document.querySelector('#heads').innerHTML=`<table><tr><th>운동·항목·구도</th><th>상태</th><th>학습 등급 0 / 1 / 2</th><th>교차검증 오차</th><th>개발 검증 기존 → 후보 오차</th><th>오류 검출률</th><th>정상 오탐률</th></tr>${rs.map(r=>`<tr><td>${esc(names[r.key[0]])}<br>${esc(itemNames[r.key[1]]||r.key[1])} · ${esc(bankNames[r.key[2]]||r.key[2])}</td><td>${r.status=='trained_experimental'?(r.candidate_gate_passed?'추가 검증 후보':'실험 후보 보존'):'정상·오류 그룹 부족'}</td><td>${[0,1,2].map(g=>r.grade_counts[g]||0).join(' / ')}<br><small>정상 ${r.normal_groups} · 오류 ${r.error_groups}그룹</small></td><td>${num(r.group_cv?.MAE)}</td><td>${num(r.current_saved_model_same_input?.MAE)} → ${num(r.fixed_development_validation?.MAE)}</td><td>${pct(r.fixed_development_validation?.error_recall)}</td><td>${pct(r.fixed_development_validation?.normal_false_alarm)}</td></tr>`).join('')}</table>`}
</script></html>
